<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --text:#0B0B0F; --sub:#6C6C72; --hair:rgba(60,60,67,.14);
  --accent:#C8552B; --accent-ink:#FFFFFF; --accent-soft:rgba(200,85,43,.10);
  --ball:#C9DE3A; --green:#2FB45A; --red:#E5483B; --amber:#E89B17; --gray:#A1A1A8; --blue:#3E7BFA;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#151517; --card2:#1E1E21; --text:#F4F4F6; --sub:#9A9AA2; --hair:rgba(255,255,255,.10);
    --accent:#E6743F; --accent-soft:rgba(230,116,63,.16); --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --card:#151517; --card2:#1E1E21; --text:#F4F4F6; --sub:#9A9AA2; --hair:rgba(255,255,255,.10);
  --accent:#E6743F; --accent-soft:rgba(230,116,63,.16); --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Header */
header{padding:calc(18px + env(safe-area-inset-top)) 0 6px;position:relative}
.refresh{position:absolute;right:0;top:calc(10px + env(safe-area-inset-top));width:38px;height:38px;border-radius:19px;background:var(--card);border:.5px solid var(--hair);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent)}
.refresh svg{width:19px;height:19px}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:50%;top:calc(6px + env(safe-area-inset-top));z-index:40;width:36px;height:36px;margin-left:-18px;border-radius:18px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.15);display:grid;place-items:center;color:var(--accent);opacity:0;transform:translateY(-50px);pointer-events:none}
.ptr svg{width:18px;height:18px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--sub);text-transform:uppercase;display:flex;gap:8px;align-items:center}
.eyebrow .ball{width:10px;height:10px;border-radius:50%;background:var(--ball);box-shadow:inset -2px -2px 0 rgba(0,0,0,.08)}
h1{font-size:34px;line-height:1.1;letter-spacing:-.025em;margin:6px 0 4px;font-weight:800}
.summary{color:var(--sub);font-size:15px;margin:0}
.summary b{color:var(--text);font-weight:600}

/* Sticky toolbar */
.toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding:10px 0;margin:8px 0 6px;border-bottom:.5px solid transparent;transition:border-color .2s}
.toolbar.stuck{border-bottom-color:var(--hair)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:14px;font-weight:600;
  color:var(--text);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;border:.5px solid var(--hair)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{font-weight:500;opacity:.6}

/* Cards */
.list{display:flex;flex-direction:column;gap:12px;padding:6px 0 10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:.5px solid var(--hair);overflow:hidden}
.card.is-off{opacity:.92}
.top{display:flex;gap:12px;padding:16px 16px 12px;align-items:flex-start;width:100%;text-align:left}
.idx{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.02em}
.card.is-off .idx{background:var(--card2);color:var(--sub)}
.head{flex:1;min-width:0}
.name{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0;line-height:1.2}
.area{font-size:13px;color:var(--sub);margin-top:2px}
.status{display:flex;align-items:flex-start;gap:7px;margin-top:8px;font-size:14px;font-weight:600}
.status .dot{margin-top:6px}
.status .muted{color:var(--sub);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--gray);position:relative}
.dot.open{background:var(--green)}
.dot.open::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--green);opacity:.25;animation:pulse 2s ease-out infinite}
.dot.soon{background:var(--amber)}
.dot.closed{background:var(--red)}
.dot.season{background:var(--gray)}
.dot.unknown{background:var(--blue)}
@keyframes pulse{0%{transform:scale(.6);opacity:.45}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.dot.open::after{animation:none}}
.chev{flex:none;width:28px;height:28px;border-radius:14px;display:grid;place-items:center;color:var(--sub);background:var(--card2);margin-top:6px;transition:transform .25s}
.card.open .chev{transform:rotate(180deg)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px 68px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--card2);color:var(--sub)}
.tag.price{color:var(--text)}
.tag.hall{background:var(--accent-soft);color:var(--accent)}
.tag.now{background:rgba(47,180,90,.12);color:var(--green)}
.area .km{color:var(--text);font-weight:600}
.card{position:relative}
.star{position:absolute;top:14px;right:50px;width:32px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--gray);z-index:2}
.star svg{width:20px;height:20px}
.star.on{color:#F5B301}
.head{padding-right:34px}
.chip.near[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.geo-msg{font-size:13px;color:var(--sub);padding:8px 2px 0}

/* Actions */
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 12px 12px}
.btn{height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;
  font-weight:650;font-size:15px;background:var(--card2);color:var(--text);transition:transform .08s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97);opacity:.85}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.call svg{color:var(--green)}
.split{display:flex;border-radius:14px;overflow:hidden;background:var(--card2)}
.split .btn{border-radius:0;background:transparent;flex:1}
.split .more{flex:none;width:40px;border-left:.5px solid var(--hair)}
.waze{width:20px;height:20px;border-radius:6px;background:#33CCFF;display:grid;place-items:center}
.waze svg{width:14px;height:14px;color:#fff}

/* Details */
.details{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.card.open .details{grid-template-rows:1fr}
.details>div{overflow:hidden}
.dl{margin:0 16px 14px;border-top:.5px solid var(--hair)}
.row{display:flex;gap:12px;padding:11px 0;border-bottom:.5px solid var(--hair);font-size:14px}
.row:last-child{border-bottom:0}
.row dt{flex:none;width:96px;color:var(--sub)}
.row dd{margin:0;flex:1;min-width:0}
.row dd small{color:var(--sub);display:block;margin-top:2px;font-size:12px}
.prices{width:100%;border-collapse:collapse;font-size:13px}
.prices td{padding:3px 0;vertical-align:top}
.prices td:last-child{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.links{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}
.link{font-size:13px;font-weight:600;color:var(--accent);padding:7px 11px;border-radius:10px;background:var(--accent-soft)}
.src{font-size:11px;color:var(--sub);padding:0 16px 14px}

/* Legend + footer */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);padding:8px 2px 0}
.legend span{display:flex;align-items:center;gap:6px}
footer{font-size:12px;color:var(--sub);padding:18px 2px 8px;line-height:1.5}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--hair)}
.tabs{max-width:300px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--sub);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .beta{font-size:9px;padding:1px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-left:3px;vertical-align:1px}
.view[hidden]{display:none}

/* Map */
#map{height:calc(100dvh - 260px);min-height:360px;border-radius:var(--r);overflow:hidden;border:.5px solid var(--hair);background:var(--card2)}
.note{background:var(--card);border:.5px solid var(--hair);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--sub);margin:10px 0}
.note b{color:var(--text)}
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{margin:12px 14px;font:14px/1.4 -apple-system,system-ui,sans-serif}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--accent);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff}
.pin span{transform:rotate(45deg);color:#fff;font:800 12px/1 system-ui}
.pin.off{background:#8E8E93}


/* Action sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:51;max-width:520px;margin:0 auto;transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}
.sheet .grp{background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:16px;overflow:hidden}
.sheet .ttl{font-size:13px;color:var(--sub);text-align:center;padding:12px 16px;border-bottom:.5px solid var(--hair)}
.sheet a,.sheet .cancel{display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;font-size:17px;border-bottom:.5px solid var(--hair);width:100%}
.sheet a:last-child{border-bottom:0}
.sheet .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.sheet .cancel{margin-top:8px;background:var(--card);border-radius:16px;justify-content:center;font-weight:650;color:var(--accent);border:0}
@media (max-width:389px){
  .actions{gap:6px;padding:0 10px 10px;grid-template-columns:1fr 1.1fr 1fr}
  .btn{font-size:14px;gap:5px;height:44px}
  .btn svg{width:16px;height:16px}
  .split .more{width:28px}
  .waze{width:18px;height:18px}
  .tags{padding-left:16px}
}
@media (min-width:700px){ h1{font-size:40px} }
</style>
</head>

/* ---------- Čas v Praze ---------- */
function pragueNow(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Prague",year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",weekday:"short",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { md:`${p.month}-${p.day}`, h:+p.hour + (+p.minute)/60, wd:p.weekday };
}
const inRange=(md,f,t)=> f<=t ? (md>=f && md<=t) : (md>=f || md<=t);
const fmtH=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return `${H}:${String(M).padStart(2,"0")}`};
const fmtMD=md=>{const [m,d]=md.split("-");return `${+d}. ${+m}.`};
const dayKey=wd=> wd==="Sat"?"sat": wd==="Sun"?"sun":"wd";

function statusOf(c){
  const n=pragueNow();
  const s=c.seasons.find(s=>inRange(n.md,s.from,s.to));
  if(!s){
    const next=[...c.seasons].sort((a,b)=>a.from.localeCompare(b.from)).find(x=>x.from>n.md)||c.seasons[0];
    return {k:"season", text:"Mimo sezónu", sub:`otevírá ${fmtMD(next.from)}`, active:false};
  }
  if(!s.hours) return {k:"unknown", text:"V sezóně", sub:"hodiny neuvedeny", active:true, season:s};
  const [o,cl]=s.hours[dayKey(n.wd)];
  if(n.h>=o && n.h<cl){
    const left=cl-n.h;
    const b=s.bands && (s.bands[dayKey(n.wd)==="wd"?"wd":"we"]||[]).find(([a,z])=>n.h>=a&&n.h<z);
    const price=b?b[2]:null;
    return left<=1 ? {k:"soon",text:"Brzy zavírá",sub:`v ${fmtH(cl)}`,active:true,open:true,season:s,price}
                   : {k:"open",text:"Otevřeno",sub:`do ${fmtH(cl)}`,active:true,open:true,season:s,price};
  }
  if(n.h<o) return {k:"closed",text:"Zavřeno",sub:`otevírá v ${fmtH(o)}`,active:true,season:s};
  return {k:"closed",text:"Zavřeno",sub:"otevírá zítra",active:true,season:s};
}

/* ---------- Oblíbené + poloha ---------- */
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=new Set(ls.get("tk-favs",[]));
let near=ls.get("tk-near",false), me=null, geoMsg="";
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);
  const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const fmtKm=d=>d<10?d.toFixed(1).replace(".",","):Math.round(d)+"";
function locate(){
  if(!navigator.geolocation){geoMsg="Poloha není v tomto prohlížeči dostupná.";render();return;}
  geoMsg="Zjišťuji polohu…"; render();
  navigator.geolocation.getCurrentPosition(p=>{me=[p.coords.latitude,p.coords.longitude];geoMsg="";render();},
    ()=>{geoMsg="Poloha není povolena – povolte ji v nastavení prohlížeče.";near=false;ls.set("tk-near",false);render();},
    {enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}

/* ---------- Render ---------- */
let filter="all";
try{ filter=localStorage.getItem("tk-filter")||"all"; }catch(e){}
const openSet=new Set();
const listEl=document.getElementById("list");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const prettyTel=t=>t.replace(/^\+420(\d{3})(\d{3})(\d{3})$/,"$1 $2 $3");

function hoursText(c){
  return c.seasons.map(s=>{
    const range = (s.from==="01-01"&&s.to==="12-31") ? "" : ` (${fmtMD(s.from)} – ${fmtMD(s.to)})`;
    if(!s.hours) return `<div><b>${esc(s.label)}</b>${range}: neuvedeno</div>`;
    const {wd,sat,sun}=s.hours, f=a=>`${fmtH(a[0])}–${fmtH(a[1])}`;
    const we = f(sat)===f(sun) ? `So–Ne ${f(sat)}` : `So ${f(sat)}, Ne ${f(sun)}`;
    return `<div><b>${esc(s.label)}</b>${range}: Po–Pá ${f(wd)}, ${we}${s.hoursNote?`<small>${esc(s.hoursNote)}</small>`:""}</div>`;
  }).join("");
}

function card(c,i){
  const st=statusOf(c);
  const tags=[];
  if(c.hall) tags.push(`<span class="tag hall">Zima v hale</span>`);
  if(c.courts!=="—") tags.push(`<span class="tag">${esc(c.courts)}</span>`);
  if(st.price) tags.push(`<span class="tag now">teď ${st.price} Kč/h</span>`);
  else tags.push(`<span class="tag price">${c.priceFrom?`od ${c.priceFrom} Kč/h`:"cena —"}</span>`);
  const prices = c.prices ? `<table class="prices">${c.prices.map(p=>`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td></tr>`).join("")}</table>${c.priceNote?`<small>${esc(c.priceNote)}</small>`:""}` : "—";
  const open=openSet.has(c.id);
  const fav=favs.has(c.id);
  return `<article class="card ${st.active?"":"is-off"} ${open?"open":""}" data-id="${c.id}">
    <button class="star ${fav?"on":""}" data-fav="${c.id}" aria-pressed="${fav}" aria-label="${fav?"Odebrat z oblíbených":"Přidat do oblíbených"}">${fav?I.starOn:I.star}</button>
    <button class="top" aria-expanded="${open}" aria-controls="d-${c.id}">
      <div class="idx">${i+1}</div>
      <div class="head">
        <h2 class="name">${esc(c.name)}</h2>
        <div class="area">${esc(c.area)}${me?` · <b class="km">${fmtKm(km(me,c.ll))} km</b>`:""}</div>
        <div class="status"><i class="dot ${st.k}"></i><span>${st.text} <span class="muted">· ${st.sub}</span></span></div>
      </div>
      <span class="chev">${I.chevD}</span>
    </button>
    <div class="tags">${tags.join("")}</div>
    <div class="actions">
      <a class="btn call" href="tel:${c.phone}" aria-label="Zavolat ${esc(c.name)}">${I.phone}Zavolat</a>
      <div class="split">
        <a class="btn" href="${NAV[0].url(c)}" target="_blank" rel="noopener" aria-label="Trasa ve Waze"><span class="waze">${I.waze}</span>Trasa</a>
        <button class="btn more" data-nav="${c.id}" aria-label="Další navigace">${I.chevD}</button>
      </div>
      <a class="btn primary" href="${c.book}" target="_blank" rel="noopener">Rezervovat</a>
    </div>
    <div class="details" id="d-${c.id}"><div>
      <dl class="dl">
        <div class="row"><dt>Klub</dt><dd>${esc(c.full)}</dd></div>
        <div class="row"><dt>Povrch</dt><dd>${esc(c.surface)}</dd></div>
        <div class="row"><dt>Kurty</dt><dd>${esc(c.courts)}</dd></div>
        <div class="row"><dt>Cena / hod</dt><dd>${prices}</dd></div>
        <div class="row"><dt>Otevřeno</dt><dd>${hoursText(c)}${c.seasonText?`<small>${esc(c.seasonText)}</small>`:""}</dd></div>
        <div class="row"><dt>Adresa</dt><dd>${esc(c.nav)}</dd></div>
        <div class="row"><dt>Telefon</dt><dd><a href="tel:${c.phone}">${prettyTel(c.phone)}</a></dd></div>
      </dl>
      <div class="links">
        <a class="link" href="${c.web}" target="_blank" rel="noopener">Web klubu ↗</a>
        ${c.book2?`<a class="link" href="${c.book2}" target="_blank" rel="noopener">Rezervace na webu ↗</a>`:""}
      </div>
    </div></div>
  </article>`;
}

/* pořadí: oblíbené → v sezóně → mimo sezónu; uvnitř skupin podle seznamu, nebo podle vzdálenosti */
function ordered(){
  const a=COURTS.map((c,i)=>({c,i,st:statusOf(c),fav:favs.has(c.id),d:me?km(me,c.ll):0}));
  const g=x=>x.fav?0:x.st.active?1:2;
  return a.sort((x,y)=>g(x)-g(y) || (near&&me ? x.d-y.d : 0) || x.i-y.i);
}
function render(){
  const sts=COURTS.map(statusOf);
  const nOpen=sts.filter(s=>s.open).length, nSeason=sts.filter(s=>s.active).length;
  document.getElementById("n-all").textContent=COURTS.length;
  document.getElementById("n-open").textContent=nOpen;
  document.getElementById("n-season").textContent=nSeason;
  const now=new Intl.DateTimeFormat("cs-CZ",{timeZone:"Europe/Prague",weekday:"long",hour:"2-digit",minute:"2-digit"}).format(new Date());
  document.getElementById("summary").textContent=now.charAt(0).toUpperCase()+now.slice(1);
  document.querySelectorAll(".chip[data-f]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filter));
  document.getElementById("near").setAttribute("aria-pressed",near);
  const gm=document.getElementById("geo-msg"); gm.hidden=!geoMsg; gm.textContent=geoMsg;
  listEl.innerHTML=ordered().map(({c,st},i)=>{
    if(filter==="open"&&!st.open) return "";
    if(filter==="season"&&!st.active) return "";
    return card(c,i);
  }).join("") || `<div class="note">Žádný kurt neodpovídá filtru.</div>`;
}

listEl.addEventListener("click",e=>{
  const st=e.target.closest("[data-fav]");
  if(st){ const id=st.dataset.fav; favs.has(id)?favs.delete(id):favs.add(id); ls.set("tk-favs",[...favs]); render(); return; }
  const more=e.target.closest("[data-nav]");
  if(more){ openSheet(COURTS.find(c=>c.id===more.dataset.nav)); return; }
  const top=e.target.closest(".top");
  if(top){
    const el=top.closest(".card"), id=el.dataset.id;
    openSet.has(id)?openSet.delete(id):openSet.add(id);
    el.classList.toggle("open"); top.setAttribute("aria-expanded",el.classList.contains("open"));
  }
});
document.getElementById("near").onclick=()=>{
  near=!near; ls.set("tk-near",near);
  if(near && !me) locate(); else render();
};
document.querySelectorAll(".chip[data-f]").forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.f; try{localStorage.setItem("tk-filter",filter)}catch(e){} render();
}));

const views={list:"view-list",map:"view-map"};
function showView(v){
  Object.entries(views).forEach(([k,id])=>document.getElementById(id).hidden=k!==v);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===v));
  document.getElementById("title").textContent = v==="list"?"Tenisové kurty":"Mapa kurtů";
  if(v==="map") initMap();
  try{ history.replaceState(null,"",v==="list"?location.pathname:"#"+v) }catch(e){}
  scrollTo(0,0);
}

let mapReady=false;
function loadLeaflet(){
  return new Promise((res,rej)=>{
    if(window.L) return res();
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}
function readCache(){ try{return JSON.parse(localStorage.getItem("tk-geo")||"{}")}catch(e){return {}} }
function writeCache(o){ try{localStorage.setItem("tk-geo",JSON.stringify(o))}catch(e){} }
async function geocode(c){
  const q = c.nav.replace(/^(Tenis Baník|LTC Praha), /,"");
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cz&q=${enc(q)}`,{headers:{"Accept-Language":"cs"}});
  const j=await r.json(); return j[0]?[+j[0].lat,+j[0].lon]:null;
}
async function initMap(){
  if(mapReady) return; mapReady=true;
  const note=document.getElementById("map-note");
  try{ await loadLeaflet(); }catch(e){ note.innerHTML="<b>Mapu se nepodařilo načíst.</b> Zkontrolujte připojení."; mapReady=false; return; }
  const map=L.map("map",{zoomControl:false,attributionControl:true}).setView([50.103,14.44],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  L.control.zoom({position:"bottomright"}).addTo(map);
  const cache=readCache(), pts=[];
  for(const [i,{c}] of ordered().entries()){
    let ll=c.ll||cache[c.id];
    if(!ll){ try{ ll=await geocode(c); if(ll){cache[c.id]=ll;writeCache(cache);} await new Promise(r=>setTimeout(r,1100)); }catch(e){} }
    if(!ll) continue;
    const st=statusOf(c);
    const icon=L.divIcon({className:"",html:`<div class="pin ${st.active?"":"off"}"><span>${i+1}</span></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]});
    L.marker(ll,{icon}).addTo(map).bindPopup(`<b>${esc(c.name)}</b><br><span style="color:#888">${st.text} · ${st.sub}</span><br>
      <a href="${NAV[0].url(c)}" target="_blank" rel="noopener" style="color:#33a">Waze</a> ·
      <a href="${c.book}" target="_blank" rel="noopener" style="color:#C8552B">Rezervovat ↗</a>`);
    pts.push(ll);
    if(pts.length>1) map.fitBounds(pts,{padding:[30,30]});
  }
}


render();
setInterval(render,60000);

/* ---------- Obnovení: ikonka + potažení dolů ---------- */
function hardReload(){ document.getElementById("refresh").classList.add("spin"); location.reload(); }
document.getElementById("refresh").onclick=hardReload;
(function(){
  const ptr=document.getElementById("ptr"), svg=ptr.firstElementChild; let y0=null, d=0;
  const sheetOpen=()=>document.getElementById("sheet").classList.contains("on");
  addEventListener("touchstart",e=>{ if(scrollY<=0 && !sheetOpen() && !e.target.closest("#map,.frame")) y0=e.touches[0].clientY; else y0=null; },{passive:true});
  addEventListener("touchmove",e=>{ if(y0===null) return; d=Math.max(0,e.touches[0].clientY-y0);
    const k=Math.min(d/80,1); ptr.style.opacity=k; ptr.style.transform=`translateY(${Math.min(d*.6,60)-50}px)`; svg.style.transform=`rotate(${d*3}deg)`; },{passive:true});
  addEventListener("touchend",()=>{ if(y0!==null && d>80){ ptr.style.transform="translateY(14px)"; svg.style.animation="spin .8s linear infinite"; hardReload(); }
    else { ptr.style.opacity=0; ptr.style.transform="translateY(-50px)"; } y0=null; d=0; });
})();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) render(); });
const h=location.hash.slice(1); if(views[h]) showView(h);
addEventListener("hashchange",()=>{ const v=location.hash.slice(1); showView(views[v]?v:"list"); });
</script>
